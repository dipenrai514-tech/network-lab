set system host-name Router-1
set system services ssh
set system login user admin class super-user
set protocols ospf area 0.0.0.0
set system services netconf ssh
set protocols bgp group ISP-PEERS type external
set protocols bgp group ISP-PEERS neighbor 192.0.2.2 peer-as 65002
set system services netconf ssh telnet
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/2.0
